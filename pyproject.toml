[project]
name = "glbsmith"
version = "0.1.0"
description = "Turn a product photo and its dimensions into a true-to-size GLB, modelled in Blender by a local AI agent."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=1.9,<2",
    "pillow>=10",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["glbsmith"]
