<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glbsmith</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header>
    <h1>glbsmith</h1>
    <p data-i18n="tagline"></p>
    <label class="lang"><span class="sr" data-i18n="language"></span>
        <select id="language"><option value="ja">日本語</option><option value="en">English</option></select>
    </label>
</header>

<main>
    <section class="panel form-panel">
        <form id="form">
            <label class="dropzone" id="dropzone" tabindex="0">
                <input type="file" id="image" accept="image/*" multiple hidden>
                <span data-i18n="drop"></span>
            </label>
            <ul class="photos" id="photos"></ul>
            <label class="field"><span data-i18n="name"></span>
                <input type="text" id="name" maxlength="120" data-i18n-placeholder="namePlaceholder"></label>
            <div class="sizes">
                <label class="field"><span data-i18n="width"></span><span class="unit"><input type="number" id="width" min="0.1" max="2000" step="0.1" required><em>cm</em></span></label>
                <label class="field"><span data-i18n="depth"></span><span class="unit"><input type="number" id="depth" min="0.1" max="2000" step="0.1" required><em>cm</em></span></label>
                <label class="field"><span data-i18n="height"></span><span class="unit"><input type="number" id="height" min="0.1" max="2000" step="0.1" required><em>cm</em></span></label>
            </div>
            <fieldset class="field">
                <legend data-i18n="agent"></legend>
                <div id="agents" class="agents"></div>
            </fieldset>
            <label class="field"><span data-i18n="model"></span>
                <select id="modelSelect"></select></label>
            <label class="field" id="modelCustom" hidden><span data-i18n="modelName"></span>
                <input type="text" id="model" maxlength="80"></label>
            <p class="note warn" id="noBlender" hidden data-i18n="noBlender"></p>
            <label class="note warn" id="noSandbox" hidden><input type="checkbox" id="allowUnsandboxed"> <span data-i18n="noSandbox"></span></label>
            <button type="submit" class="primary" id="submit" data-i18n="create"></button>
            <label class="field concurrency"><span data-i18n="concurrency"></span>
                <select id="concurrency"></select>
                <small class="note" id="load" role="status"></small></label>
            <p class="note" data-i18n="quotaNote"></p>
            <p class="note error" id="formError" role="alert" hidden></p>
        </form>
        <h2 data-i18n="history"></h2>
        <ul class="history" id="history"></ul>
    </section>

    <section class="panel result-panel" id="result" hidden>
        <div class="result-head">
            <div>
                <h2 id="resultTitle"></h2>
                <p class="status" id="status" role="status"></p>
            </div>
            <div class="actions">
                <button type="button" id="cancel" data-i18n="cancel" hidden></button>
                <button type="button" id="reviseStart" data-i18n="revise.open" hidden></button>
                <a class="button primary" id="download" data-i18n="download" hidden></a>
            </div>
        </div>
        <div class="compare">
            <figure><figcaption data-i18n="photo"></figcaption><img id="reference" alt="">
                <div class="reference-strip" id="referenceStrip"></div></figure>
            <figure class="viewer-wrap" id="viewerWrap">
                <figcaption data-i18n="result"></figcaption>
                <div id="viewer"></div>
                <p class="measure" id="measure"></p>
            </figure>
        </div>
        <section class="revise" id="revise" hidden>
            <h3 data-i18n="revise.title"></h3>
            <p class="note" data-i18n="revise.help"></p>
            <div class="paint-tools" role="toolbar">
                <button type="button" data-revise-tool="paint" data-i18n="revise.paint"></button>
                <button type="button" data-revise-tool="erase" data-i18n="paint.eraser"></button>
                <button type="button" data-revise-tool="view" data-i18n="revise.view"></button>
                <label class="brush-size"><span data-i18n="paint.size"></span> <input type="range" id="reviseBrush" min="1" max="100" value="25"></label>
                <button type="button" id="reviseUndo" data-i18n="paint.undo"></button>
            </div>
            <ol class="colours" id="colours"></ol>
            <button type="button" id="addColour" data-i18n="revise.addColour"></button>
            <label class="field"><span data-i18n="revise.general"></span>
                <textarea id="reviseGeneral" rows="2" maxlength="4000" data-i18n-placeholder="revise.generalPlaceholder"></textarea></label>
            <label class="field"><span data-i18n="agent"></span><select id="reviseAgent"></select></label>
            <label class="field"><span data-i18n="model"></span><select id="reviseModelSelect"></select></label>
            <label class="field" id="reviseModelCustom" hidden><span data-i18n="modelName"></span>
                <input type="text" id="reviseModel" maxlength="80"></label>
            <p class="note error" id="reviseError" role="alert" hidden></p>
            <div class="paint-actions">
                <button type="button" id="reviseCancel" data-i18n="paint.cancel"></button>
                <button type="button" class="primary" id="reviseSubmit" data-i18n="revise.submit"></button>
            </div>
        </section>
        <p class="note warn" id="sizeNote" hidden></p>
        <p class="note warn" id="checkNote" hidden></p>
        <p class="message" id="message"></p>
        <h3 id="rendersTitle" data-i18n="renders" hidden></h3>
        <div class="renders" id="renders"></div>
        <details><summary data-i18n="log"></summary><ol class="log" id="log"></ol></details>
    </section>

    <section class="panel empty" id="empty"><p data-i18n="empty"></p></section>
</main>

<dialog id="paint" aria-labelledby="paintTitle">
    <h2 id="paintTitle" data-i18n="paint.title"></h2>
    <p class="note" data-i18n="paint.help"></p>
    <div class="paint-tools" role="toolbar">
        <button type="button" data-paint-tool="brush" data-i18n="paint.brush"></button>
        <button type="button" data-paint-tool="eraser" data-i18n="paint.eraser"></button>
        <button type="button" data-paint-tool="fill" data-i18n="paint.fill"></button>
        <label class="brush-size"><span data-i18n="paint.size"></span> <input type="range" id="brushSize" min="1" max="100" value="30"></label>
        <button type="button" id="paintUndo" data-i18n="paint.undo"></button>
        <button type="button" id="paintClear" data-i18n="paint.clear"></button>
    </div>
    <div class="paint-stage" id="paintStage">
        <canvas id="paintPhoto"></canvas>
        <canvas id="paintLayer"></canvas>
    </div>
    <div class="paint-actions">
        <button type="button" id="paintCancel" data-i18n="paint.cancel"></button>
        <button type="button" class="primary" id="paintSave" data-i18n="paint.save"></button>
    </div>
</dialog>
<script type="module" src="/src/main.js"></script>
</body>
</html>
